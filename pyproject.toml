[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-scratch-lab"
version = "0.1.0"
description = "A small Vision Transformer built and explained from scratch"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]
